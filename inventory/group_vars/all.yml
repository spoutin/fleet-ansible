---
# Fleet-wide variables for SSH CA rollout

# URL from which the SSH CA public key is downloaded
# Uses the unauthenticated endpoint exposed by Spoutin PKI or OpenBao natively
ssh_ca_public_key_url: "https://pki.int.spoutin.org/ssh-ca.pub"
ssh_ca_fallback_url: "https://secrets.int.spoutin.org/v1/ssh/public_key"

# Path where the trusted CA key is installed on client hosts
ssh_ca_keys_path: "/etc/ssh/trusted-user-ca-keys.pub"

# OpenSSH Key Revocation List (KRL)
ssh_krl_url: "https://wifi.int.spoutin.org/ssh-krl"
ssh_krl_fallback_url: "https://pki.int.spoutin.org/ssh-krl"
ssh_krl_path: "/etc/ssh/revoked-keys.krl"

# Drop-in configuration directory and file
ssh_config_dir: "/etc/ssh"
sshd_config_dropin_dir: "/etc/ssh/sshd_config.d"
sshd_config_dropin_file: "60-pki-ssh-ca.conf"
sshd_config_dropin_path: "{{ sshd_config_dropin_dir }}/{{ sshd_config_dropin_file }}"

# Default service name (overridden in OS-specific group vars)
sshd_service_name: "ssh"
supports_sshd_config_d: true

# Operator account to provision across fleet for SSH CA login
operator_user: "ablack"
