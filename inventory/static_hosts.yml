---
# Static Host Definitions
# Defines the Proxmox hypervisors used in Phase 1 (zero-SSH bootstrap)
# and any bare metal systems that may not run the dynamic agent.

all:
  children:
    hypervisors:
      hosts:
        pve1:
          ansible_host: 10.0.0.41   # pve1.int.spoutin.org
        pve2:
          ansible_host: 10.0.0.42   # pve2.int.spoutin.org
      vars:
        ansible_python_interpreter: /usr/bin/python3
    "10.0.0.41":
      hosts:
        pve1:
    "10.0.0.42":
      hosts:
        pve2:
