[defaults]
inventory = inventory/
inventory_ignore_patterns = ^__pycache__$, \.pyc$, \.swp$, \.bak$
force_valid_group_names = ignore
roles_path = /opt/fleet-ansible/roles:roles/
remote_tmp = /tmp/.ansible-${USER}/tmp
remote_user = ansible
private_key_file = ~/.ssh/ansible_controller
interpreter_python = auto_silent
deprecation_warnings = False
host_key_checking = False
timeout = 60
forks = 20
retry_files_enabled = False

[privilege_escalation]
become = False
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey,password -o StrictHostKeyChecking=accept-new
