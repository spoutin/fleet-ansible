---
# Proxmox VE Host-Level Bootstrap Role
# Executes directly on Proxmox VE hypervisor nodes to inject SSH CA trust into
# LXC containers (via `pct push`/`pct exec`) and QEMU VMs (via `qm guest exec`).
# This achieves 100% zero-SSH, passwordless bootstrapping for virtualized guests!

- name: Stage SSH CA credentials and KRL on Ansible controller
  delegate_to: localhost
  run_once: true
  become: false
  block:
    - name: Fetch SSH CA public key from PKI or OpenBao to controller
      ansible.builtin.get_url:
        url: "{{ ssh_ca_public_key_url }}"
        dest: /tmp/fleet_ca_public_key.pub
        mode: '0644'
        validate_certs: false
      register: controller_dl_ca
      ignore_errors: true

    - name: Fallback fetch SSH CA public key from OpenBao directly to controller
      ansible.builtin.get_url:
        url: "{{ ssh_ca_fallback_url }}"
        dest: /tmp/fleet_ca_public_key.pub
        mode: '0644'
        validate_certs: false
      when: controller_dl_ca is failed
      ignore_errors: true

    - name: Fetch OpenSSH Key Revocation List (KRL) to controller
      ansible.builtin.get_url:
        url: "{{ ssh_krl_url }}"
        dest: /tmp/fleet_revoked_keys.krl
        mode: '0644'
        validate_certs: false
      register: controller_dl_krl
      ignore_errors: true

    - name: Fallback fetch OpenSSH KRL to controller
      ansible.builtin.get_url:
        url: "{{ ssh_krl_fallback_url }}"
        dest: /tmp/fleet_revoked_keys.krl
        mode: '0644'
        validate_certs: false
      when: controller_dl_krl is failed
      register: controller_dl_krl_fallback
      ignore_errors: true

    - name: Check if KRL was staged on controller
      ansible.builtin.stat:
        path: /tmp/fleet_revoked_keys.krl
      register: controller_krl_stat

    - name: Initialize safe empty KRL on controller if absent
      ansible.builtin.copy:
        content: "{{ 'U1NIS1JMCgAAAAABAAAAAAAAAAAAAAAAasjsugAAAAAAAAAAAAAAAAAAAAA=' | b64decode }}"
        dest: /tmp/fleet_revoked_keys.krl
        mode: '0644'
      when: not controller_krl_stat.stat.exists or controller_krl_stat.stat.size == 0

- name: Push SSH CA public key to hypervisor staging directory
  ansible.builtin.copy:
    src: /tmp/fleet_ca_public_key.pub
    dest: /tmp/pki-trusted-ca.pub
    mode: '0644'

- name: Push OpenSSH KRL to hypervisor staging directory
  ansible.builtin.copy:
    src: /tmp/fleet_revoked_keys.krl
    dest: /tmp/revoked-keys.krl
    mode: '0644'

- name: Stage 60-pki-ssh-ca.conf template on hypervisor
  ansible.builtin.template:
    src: 60-pki-ssh-ca.conf.j2
    dest: /tmp/60-pki-ssh-ca.conf
    mode: '0644'

- name: Discover running LXC container IDs on hypervisor
  ansible.builtin.shell: |
    pct list 2>/dev/null | awk '$2=="running" {print $1}'
  register: pct_running
  changed_when: false

- name: Inject SSH CA into running LXC containers
  loop: "{{ pct_running.stdout_lines | default([]) }}"
  ansible.builtin.shell: |
    # Check if container has an SSH server installed
    if ! pct exec {{ item }} -- sh -c 'test -f /etc/ssh/sshd_config || which sshd >/dev/null 2>&1'; then
      echo "Container {{ item }} has no SSH server installed, skipping."
      exit 0
    fi

    # Ensure sudo is installed
    pct exec {{ item }} -- sh -c 'which sudo >/dev/null 2>&1 || (apt-get update && apt-get install -y sudo || apk add sudo || dnf install -y sudo || yum install -y sudo || true)'

    # Create ansible user if missing
    pct exec {{ item }} -- sh -c 'id -u ansible >/dev/null 2>&1 || (useradd -m -s /bin/bash ansible 2>/dev/null || adduser -D -s /bin/sh ansible 2>/dev/null || true)'

    # Configure passwordless sudo for ansible user
    pct exec {{ item }} -- sh -c 'mkdir -p /etc/sudoers.d && echo "ansible ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/ansible && chmod 0440 /etc/sudoers.d/ansible'

    # Create operator user if configured
    {% if operator_user | default('') %}
    pct exec {{ item }} -- sh -c 'id -u {{ operator_user }} >/dev/null 2>&1 || (useradd -m -s /bin/bash {{ operator_user }} 2>/dev/null || adduser -D -s /bin/sh {{ operator_user }} 2>/dev/null || true)'
    pct exec {{ item }} -- sh -c 'mkdir -p /etc/sudoers.d && echo "{{ operator_user }} ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/{{ operator_user }} && chmod 0440 /etc/sudoers.d/{{ operator_user }}'
    {% endif %}

    # Ensure /etc/ssh and drop-in dir exist inside the LXC
    pct exec {{ item }} -- mkdir -p /etc/ssh/sshd_config.d
    
    # Push the CA public key
    pct push {{ item }} /tmp/pki-trusted-ca.pub /etc/ssh/trusted-user-ca-keys.pub -perms 644
    
    # Push the KRL
    pct push {{ item }} /tmp/revoked-keys.krl /etc/ssh/revoked-keys.krl -perms 644

    # Push the sshd drop-in configuration
    pct push {{ item }} /tmp/60-pki-ssh-ca.conf /etc/ssh/sshd_config.d/60-pki-ssh-ca.conf -perms 644
    
    # Ensure Include directive is present in /etc/ssh/sshd_config if missing
    pct exec {{ item }} -- sh -c 'grep -q "Include /etc/ssh/sshd_config.d/\*\.conf" /etc/ssh/sshd_config || sed -i "1s|^|Include /etc/ssh/sshd_config.d/*.conf\n|" /etc/ssh/sshd_config'
    
    # Validate configuration and restart/reload sshd safely
    pct exec {{ item }} -- sh -c '(/usr/sbin/sshd -t 2>/dev/null || sshd -t 2>/dev/null) && (systemctl restart ssh 2>/dev/null || systemctl restart sshd 2>/dev/null || rc-service sshd restart 2>/dev/null || systemctl reload ssh 2>/dev/null || systemctl reload sshd 2>/dev/null || true)'
  register: lxc_bootstrap_result
  changed_when: "'has no SSH server' not in lxc_bootstrap_result.stdout"
  ignore_errors: true

- name: Discover running QEMU VM IDs on hypervisor
  ansible.builtin.shell: |
    qm list 2>/dev/null | awk '$3=="running" {print $1}'
  register: qm_running
  changed_when: false

- name: Inject SSH CA into QEMU VMs with active guest agent
  loop: "{{ qm_running.stdout_lines | default([]) }}"
  ansible.builtin.shell: |
    # Test if guest agent is active
    if qm guest cmd {{ item }} ping 2>/dev/null; then
      # Check if VM has an SSH server installed
      if ! qm guest exec {{ item }} -- /bin/sh -c "test -f /etc/ssh/sshd_config || which sshd >/dev/null 2>&1"; then
        echo "VM {{ item }} has no SSH server installed, skipping."
        exit 0
      fi

      CA_CONTENT=$(cat /tmp/pki-trusted-ca.pub)
      CONF_CONTENT=$(cat /tmp/60-pki-ssh-ca.conf)
      KRL_BASE64=$(base64 -w 0 /tmp/revoked-keys.krl 2>/dev/null || base64 /tmp/revoked-keys.krl)
      
      qm guest exec {{ item }} -- /bin/sh -c "which sudo >/dev/null 2>&1 || (apt-get update && apt-get install -y sudo || dnf install -y sudo || true); \
        id -u ansible >/dev/null 2>&1 || (useradd -m -s /bin/bash ansible 2>/dev/null || true); \
        mkdir -p /etc/sudoers.d && echo 'ansible ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/ansible && chmod 0440 /etc/sudoers.d/ansible; \
        {% if operator_user | default('') %}id -u {{ operator_user }} >/dev/null 2>&1 || (useradd -m -s /bin/bash {{ operator_user }} 2>/dev/null || true); \
        mkdir -p /etc/sudoers.d && echo '{{ operator_user }} ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/{{ operator_user }} && chmod 0440 /etc/sudoers.d/{{ operator_user }}; \
        {% endif %}mkdir -p /etc/ssh/sshd_config.d && \
        echo '$CA_CONTENT' > /etc/ssh/trusted-user-ca-keys.pub && \
        chmod 644 /etc/ssh/trusted-user-ca-keys.pub && \
        echo '$KRL_BASE64' | base64 -d > /etc/ssh/revoked-keys.krl && \
        chmod 644 /etc/ssh/revoked-keys.krl && \
        echo '$CONF_CONTENT' > /etc/ssh/sshd_config.d/60-pki-ssh-ca.conf && \
        chmod 644 /etc/ssh/sshd_config.d/60-pki-ssh-ca.conf && \
        (grep -q 'Include /etc/ssh/sshd_config.d/\*.conf' /etc/ssh/sshd_config || sed -i '1s|^|Include /etc/ssh/sshd_config.d/*.conf\n|' /etc/ssh/sshd_config) && \
        (/usr/sbin/sshd -t 2>/dev/null || sshd -t 2>/dev/null) && (systemctl restart ssh 2>/dev/null || systemctl restart sshd 2>/dev/null || systemctl reload ssh 2>/dev/null || true)"
    else
      echo "Guest agent not available on VM {{ item }}, skipping to network SSH fallback."
    fi
  register: qm_bootstrap_result
  changed_when: "'Guest agent not available' not in qm_bootstrap_result.stdout and 'has no SSH server' not in qm_bootstrap_result.stdout"
  ignore_errors: true

- name: Ensure ansible user and SSH CA trust are configured on hypervisor itself
  ansible.builtin.shell: |
    which sudo >/dev/null 2>&1 || (apt-get update && apt-get install -y sudo)
    id -u ansible >/dev/null 2>&1 || useradd -m -s /bin/bash ansible
    mkdir -p /etc/sudoers.d && echo "ansible ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/ansible && chmod 0440 /etc/sudoers.d/ansible
    {% if operator_user | default('') %}
    id -u {{ operator_user }} >/dev/null 2>&1 || useradd -m -s /bin/bash {{ operator_user }}
    mkdir -p /etc/sudoers.d && echo "{{ operator_user }} ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/{{ operator_user }} && chmod 0440 /etc/sudoers.d/{{ operator_user }}
    {% endif %}
    mkdir -p /etc/ssh/sshd_config.d
    cp /tmp/pki-trusted-ca.pub /etc/ssh/trusted-user-ca-keys.pub && chmod 644 /etc/ssh/trusted-user-ca-keys.pub
    cp /tmp/revoked-keys.krl /etc/ssh/revoked-keys.krl && chmod 644 /etc/ssh/revoked-keys.krl
    cp /tmp/60-pki-ssh-ca.conf /etc/ssh/sshd_config.d/60-pki-ssh-ca.conf && chmod 644 /etc/ssh/sshd_config.d/60-pki-ssh-ca.conf
    grep -q 'Include /etc/ssh/sshd_config.d/\*.conf' /etc/ssh/sshd_config || sed -i '1s|^|Include /etc/ssh/sshd_config.d/*.conf\n|' /etc/ssh/sshd_config
    (/usr/sbin/sshd -t 2>/dev/null || sshd -t 2>/dev/null) && (systemctl restart ssh 2>/dev/null || systemctl restart sshd 2>/dev/null || systemctl reload ssh 2>/dev/null || true)

- name: Remove temporary hypervisor staging files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/pki-trusted-ca.pub
    - /tmp/revoked-keys.krl
    - /tmp/60-pki-ssh-ca.conf
