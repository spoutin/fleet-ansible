---
# Proxmox VE Host-Level Bootstrap Role
# Executes directly on Proxmox VE hypervisor nodes to inject SSH CA trust into
# LXC containers (via `pct push`/`pct exec`) and QEMU VMs (via `qm guest exec`).
# This achieves 100% zero-SSH, passwordless bootstrapping for virtualized guests!

- name: Stage SSH CA credentials and KRL on Ansible controller
  delegate_to: localhost
  run_once: true
  become: false
  block:
    - name: Fetch SSH CA public key from PKI or OpenBao to controller
      ansible.builtin.get_url:
        url: "{{ ssh_ca_public_key_url }}"
        dest: /tmp/fleet_ca_public_key.pub
        mode: '0644'
        validate_certs: false
      register: controller_dl_ca
      ignore_errors: true

    - name: Fallback fetch SSH CA public key from OpenBao directly to controller
      ansible.builtin.get_url:
        url: "{{ ssh_ca_fallback_url }}"
        dest: /tmp/fleet_ca_public_key.pub
        mode: '0644'
        validate_certs: false
      when: controller_dl_ca is failed
      ignore_errors: true

    - name: Fetch OpenSSH Key Revocation List (KRL) to controller
      ansible.builtin.get_url:
        url: "{{ ssh_krl_url }}"
        dest: /tmp/fleet_revoked_keys.krl
        mode: '0644'
        validate_certs: false
      register: controller_dl_krl
      ignore_errors: true

    - name: Fallback fetch OpenSSH KRL to controller
      ansible.builtin.get_url:
        url: "{{ ssh_krl_fallback_url }}"
        dest: /tmp/fleet_revoked_keys.krl
        mode: '0644'
        validate_certs: false
      when: controller_dl_krl is failed
      register: controller_dl_krl_fallback
      ignore_errors: true

    - name: Check if KRL was staged on controller
      ansible.builtin.stat:
        path: /tmp/fleet_revoked_keys.krl
      register: controller_krl_stat

    - name: Initialize safe empty KRL on controller if absent
      ansible.builtin.copy:
        content: "{{ 'U1NIS1JMCgAAAAABAAAAAAAAAAAAAAAAasjsugAAAAAAAAAAAAAAAAAAAAA=' | b64decode }}"
        dest: /tmp/fleet_revoked_keys.krl
        mode: '0644'
      when: not controller_krl_stat.stat.exists or controller_krl_stat.stat.size == 0

- name: Push SSH CA public key to hypervisor staging directory
  ansible.builtin.copy:
    src: /tmp/fleet_ca_public_key.pub
    dest: /tmp/pki-trusted-ca.pub
    mode: '0644'

- name: Push OpenSSH KRL to hypervisor staging directory
  ansible.builtin.copy:
    src: /tmp/fleet_revoked_keys.krl
    dest: /tmp/revoked-keys.krl
    mode: '0644'

- name: Stage 60-pki-ssh-ca.conf template on hypervisor
  ansible.builtin.template:
    src: 60-pki-ssh-ca.conf.j2
    dest: /tmp/60-pki-ssh-ca.conf
    mode: '0644'

- name: Discover running LXC container IDs on hypervisor
  ansible.builtin.shell: |
    pct list 2>/dev/null | awk '$2=="running" {print $1}'
  register: pct_running
  changed_when: false

- name: Inject SSH CA into running LXC containers
  loop: "{{ pct_running.stdout_lines | default([]) }}"
  ansible.builtin.shell: |
    if ! pct exec {{ item }} -- /bin/sh -c "test -f /etc/ssh/sshd_config || which sshd >/dev/null 2>&1"; then
      exit 0
    fi

    CA_CONTENT=$(cat /tmp/pki-trusted-ca.pub)
    CONF_CONTENT=$(cat /tmp/60-pki-ssh-ca.conf)
    KRL_BASE64=$(base64 -w 0 /tmp/revoked-keys.krl 2>/dev/null || base64 /tmp/revoked-keys.krl)
    CA_HASH=$(sha256sum /tmp/pki-trusted-ca.pub 2>/dev/null | awk '{print $1}')
    KRL_HASH=$(sha256sum /tmp/revoked-keys.krl 2>/dev/null | awk '{print $1}')
    CONF_HASH=$(sha256sum /tmp/60-pki-ssh-ca.conf 2>/dev/null | awk '{print $1}')

    pct exec {{ item }} -- /bin/sh -c "
      CHANGED=0
      if ! id -u ansible >/dev/null 2>&1; then
        (useradd -m -s /bin/bash ansible 2>/dev/null || adduser -D -s /bin/sh ansible 2>/dev/null || true)
        CHANGED=1
      fi
      if [ ! -f /etc/sudoers.d/ansible ]; then
        mkdir -p /etc/sudoers.d
        echo 'ansible ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/ansible && chmod 0440 /etc/sudoers.d/ansible
        CHANGED=1
      fi
      {% if operator_user | default('') %}
      if ! id -u {{ operator_user }} >/dev/null 2>&1; then
        (useradd -m -s /bin/bash {{ operator_user }} 2>/dev/null || adduser -D -s /bin/sh {{ operator_user }} 2>/dev/null || true)
        CHANGED=1
      fi
      if [ ! -f /etc/sudoers.d/{{ operator_user }} ]; then
        mkdir -p /etc/sudoers.d
        echo '{{ operator_user }} ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/{{ operator_user }} && chmod 0440 /etc/sudoers.d/{{ operator_user }}
        CHANGED=1
      fi
      {% endif %}
      mkdir -p /etc/ssh/sshd_config.d /run/sshd
      if [ \"\$(sha256sum /etc/ssh/trusted-user-ca-keys.pub 2>/dev/null | awk '{print \$1}')\" != \"$CA_HASH\" ]; then
        echo '$CA_CONTENT' > /etc/ssh/trusted-user-ca-keys.pub && chmod 644 /etc/ssh/trusted-user-ca-keys.pub
        CHANGED=1
      fi
      if [ \"\$(sha256sum /etc/ssh/revoked-keys.krl 2>/dev/null | awk '{print \$1}')\" != \"$KRL_HASH\" ]; then
        echo '$KRL_BASE64' | base64 -d > /etc/ssh/revoked-keys.krl && chmod 644 /etc/ssh/revoked-keys.krl
        CHANGED=1
      fi
      if [ ! -f /etc/ssh/sshd_config.d/60-pki-ssh-ca.conf ] || \
         ! grep -q '^TrustedUserCAKeys' /etc/ssh/sshd_config.d/60-pki-ssh-ca.conf 2>/dev/null || \
         ! grep -q '^RevokedKeys' /etc/ssh/sshd_config.d/60-pki-ssh-ca.conf 2>/dev/null; then
        echo '$CONF_CONTENT' > /etc/ssh/sshd_config.d/60-pki-ssh-ca.conf && chmod 644 /etc/ssh/sshd_config.d/60-pki-ssh-ca.conf
        CHANGED=1
      fi
      if ! grep -q 'Include /etc/ssh/sshd_config.d/\*.conf' /etc/ssh/sshd_config 2>/dev/null; then
        (echo 'Include /etc/ssh/sshd_config.d/*.conf'; cat /etc/ssh/sshd_config 2>/dev/null) > /tmp/sshd_config.tmp && mv /tmp/sshd_config.tmp /etc/ssh/sshd_config 2>/dev/null || true
        CHANGED=1
      fi
      if [ \"\$CHANGED\" -eq 1 ]; then
        ((/usr/sbin/sshd -t 2>/dev/null || sshd -t 2>/dev/null) && (systemctl restart ssh.socket 2>/dev/null || systemctl restart ssh 2>/dev/null || systemctl restart sshd 2>/dev/null || rc-service sshd restart 2>/dev/null || systemctl reload ssh 2>/dev/null || systemctl reload sshd 2>/dev/null || true)) || true
        echo 'CHANGED'
      fi
    "
  register: lxc_bootstrap_result
  changed_when: "'CHANGED' in lxc_bootstrap_result.stdout"
  ignore_errors: true

- name: Discover running QEMU VM IDs on hypervisor
  ansible.builtin.shell: |
    qm list 2>/dev/null | awk '$3=="running" {print $1}'
  register: qm_running
  changed_when: false

- name: Inject SSH CA into QEMU VMs with active guest agent
  loop: "{{ qm_running.stdout_lines | default([]) }}"
  ansible.builtin.shell: |
    # Test if guest agent is active
    if qm guest cmd {{ item }} ping 2>/dev/null; then
      if ! qm guest exec {{ item }} -- /bin/sh -c "test -f /etc/ssh/sshd_config || which sshd >/dev/null 2>&1"; then
        exit 0
      fi

      CA_CONTENT=$(cat /tmp/pki-trusted-ca.pub)
      CONF_CONTENT=$(cat /tmp/60-pki-ssh-ca.conf)
      KRL_BASE64=$(base64 -w 0 /tmp/revoked-keys.krl 2>/dev/null || base64 /tmp/revoked-keys.krl)
      CA_HASH=$(sha256sum /tmp/pki-trusted-ca.pub 2>/dev/null | awk '{print $1}')
      KRL_HASH=$(sha256sum /tmp/revoked-keys.krl 2>/dev/null | awk '{print $1}')
      CONF_HASH=$(sha256sum /tmp/60-pki-ssh-ca.conf 2>/dev/null | awk '{print $1}')

      qm guest exec {{ item }} -- /bin/sh -c "
        CHANGED=0
        if ! id -u ansible >/dev/null 2>&1; then
          (useradd -m -s /bin/bash ansible 2>/dev/null || true); CHANGED=1
        fi
        if [ ! -f /etc/sudoers.d/ansible ]; then
          mkdir -p /etc/sudoers.d && echo 'ansible ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/ansible && chmod 0440 /etc/sudoers.d/ansible; CHANGED=1
        fi
        {% if operator_user | default('') %}
        if ! id -u {{ operator_user }} >/dev/null 2>&1; then
          (useradd -m -s /bin/bash {{ operator_user }} 2>/dev/null || true); CHANGED=1
        fi
        if [ ! -f /etc/sudoers.d/{{ operator_user }} ]; then
          mkdir -p /etc/sudoers.d && echo '{{ operator_user }} ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/{{ operator_user }} && chmod 0440 /etc/sudoers.d/{{ operator_user }}; CHANGED=1
        fi
        {% endif %}
        mkdir -p /etc/ssh/sshd_config.d /run/sshd
        if [ \"\$(sha256sum /etc/ssh/trusted-user-ca-keys.pub 2>/dev/null | awk '{print \$1}')\" != \"$CA_HASH\" ]; then
          echo '$CA_CONTENT' > /etc/ssh/trusted-user-ca-keys.pub && chmod 644 /etc/ssh/trusted-user-ca-keys.pub; CHANGED=1
        fi
        if [ \"\$(sha256sum /etc/ssh/revoked-keys.krl 2>/dev/null | awk '{print \$1}')\" != \"$KRL_HASH\" ]; then
          echo '$KRL_BASE64' | base64 -d > /etc/ssh/revoked-keys.krl && chmod 644 /etc/ssh/revoked-keys.krl; CHANGED=1
        fi
        if [ ! -f /etc/ssh/sshd_config.d/60-pki-ssh-ca.conf ] || \
           ! grep -q '^TrustedUserCAKeys' /etc/ssh/sshd_config.d/60-pki-ssh-ca.conf 2>/dev/null || \
           ! grep -q '^RevokedKeys' /etc/ssh/sshd_config.d/60-pki-ssh-ca.conf 2>/dev/null; then
          echo '$CONF_CONTENT' > /etc/ssh/sshd_config.d/60-pki-ssh-ca.conf && chmod 644 /etc/ssh/sshd_config.d/60-pki-ssh-ca.conf; CHANGED=1
        fi
        if ! grep -q 'Include /etc/ssh/sshd_config.d/\*.conf' /etc/ssh/sshd_config 2>/dev/null; then
          (echo 'Include /etc/ssh/sshd_config.d/*.conf'; cat /etc/ssh/sshd_config 2>/dev/null) > /tmp/sshd_config.tmp && mv /tmp/sshd_config.tmp /etc/ssh/sshd_config 2>/dev/null || true; CHANGED=1
        fi
        if [ \"\$CHANGED\" -eq 1 ]; then
          ((/usr/sbin/sshd -t 2>/dev/null || sshd -t 2>/dev/null) && (systemctl restart ssh.socket 2>/dev/null || systemctl restart ssh 2>/dev/null || systemctl restart sshd 2>/dev/null || systemctl reload ssh 2>/dev/null || true)) || true
          echo 'CHANGED'
        fi"
    fi
  register: qm_bootstrap_result
  changed_when: "'CHANGED' in qm_bootstrap_result.stdout"
  ignore_errors: true

- name: Ensure ansible user and SSH CA trust are configured on hypervisor itself
  ansible.builtin.shell: |
    CHANGED=0
    which sudo >/dev/null 2>&1 || (apt-get update && apt-get install -y sudo && CHANGED=1)
    if ! id -u ansible >/dev/null 2>&1; then
      useradd -m -s /bin/bash ansible
      CHANGED=1
    fi
    if [ ! -f /etc/sudoers.d/ansible ]; then
      mkdir -p /etc/sudoers.d && echo "ansible ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/ansible && chmod 0440 /etc/sudoers.d/ansible
      CHANGED=1
    fi
    {% if operator_user | default('') %}
    if ! id -u {{ operator_user }} >/dev/null 2>&1; then
      useradd -m -s /bin/bash {{ operator_user }}
      CHANGED=1
    fi
    if [ ! -f /etc/sudoers.d/{{ operator_user }} ]; then
      mkdir -p /etc/sudoers.d && echo "{{ operator_user }} ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/{{ operator_user }} && chmod 0440 /etc/sudoers.d/{{ operator_user }}
      CHANGED=1
    fi
    {% endif %}
    mkdir -p /etc/ssh/sshd_config.d /run/sshd
    if ! cmp -s /tmp/pki-trusted-ca.pub /etc/ssh/trusted-user-ca-keys.pub; then
      cp /tmp/pki-trusted-ca.pub /etc/ssh/trusted-user-ca-keys.pub && chmod 644 /etc/ssh/trusted-user-ca-keys.pub
      CHANGED=1
    fi
    if ! cmp -s /tmp/revoked-keys.krl /etc/ssh/revoked-keys.krl; then
      cp /tmp/revoked-keys.krl /etc/ssh/revoked-keys.krl && chmod 644 /etc/ssh/revoked-keys.krl
      CHANGED=1
    fi
    if [ ! -f /etc/ssh/sshd_config.d/60-pki-ssh-ca.conf ] || \
       ! grep -q '^TrustedUserCAKeys' /etc/ssh/sshd_config.d/60-pki-ssh-ca.conf 2>/dev/null || \
       ! grep -q '^RevokedKeys' /etc/ssh/sshd_config.d/60-pki-ssh-ca.conf 2>/dev/null; then
      cp /tmp/60-pki-ssh-ca.conf /etc/ssh/sshd_config.d/60-pki-ssh-ca.conf && chmod 644 /etc/ssh/sshd_config.d/60-pki-ssh-ca.conf
      CHANGED=1
    fi
    if ! grep -q 'Include /etc/ssh/sshd_config.d/\*.conf' /etc/ssh/sshd_config 2>/dev/null; then
      sed -i '1s|^|Include /etc/ssh/sshd_config.d/*.conf\n|' /etc/ssh/sshd_config
      CHANGED=1
    fi
    if [ "$CHANGED" -eq 1 ]; then
      ((/usr/sbin/sshd -t 2>/dev/null || sshd -t 2>/dev/null) && (systemctl restart ssh.socket 2>/dev/null || systemctl restart ssh 2>/dev/null || systemctl restart sshd 2>/dev/null || systemctl reload ssh 2>/dev/null || true)) || true
      echo "CHANGED"
    fi
  register: hypervisor_bootstrap_result
  changed_when: "'CHANGED' in hypervisor_bootstrap_result.stdout"
