---
- name: Verify LAN-Orangutan API token is present
  ansible.builtin.fail:
    msg: >-
      Cannot sync OS facts: LAN-Orangutan API token is missing or empty.
      Ensure ORANGUTAN_API_TOKEN or ORANGUTAN_PASSWORD is set in /etc/fleet/openbao.env,
      exported as an environment variable, or stored in OpenBao KV secrets at v1/fleet/data/credentials.
  when: orangutan_facts_token | default('') | length == 0
  run_once: true

- name: Determine target device MAC address from facts and inventory
  ansible.builtin.set_fact:
    device_mac: >-
      {{
        ansible_default_ipv4.macaddress
        if (ansible_default_ipv4 is defined and ansible_default_ipv4.macaddress is defined and ansible_default_ipv4.macaddress and ansible_default_ipv4.macaddress != '' and ansible_default_ipv4.macaddress | lower != 'none')
        else (
          orangutan_mac
          if (orangutan_mac is defined and orangutan_mac and orangutan_mac != '' and orangutan_mac | lower != 'none')
          else (
            hostvars[inventory_hostname]['ansible_' + (ansible_default_ipv4.interface | default(''))]['macaddress']
            if (ansible_default_ipv4 is defined and ansible_default_ipv4.interface is defined and hostvars[inventory_hostname]['ansible_' + ansible_default_ipv4.interface] is defined and hostvars[inventory_hostname]['ansible_' + ansible_default_ipv4.interface]['macaddress'] is defined and hostvars[inventory_hostname]['ansible_' + ansible_default_ipv4.interface]['macaddress'] != '' and hostvars[inventory_hostname]['ansible_' + ansible_default_ipv4.interface]['macaddress'] | lower != 'none')
            else ''
          )
        )
      }}

- name: Probe interface MAC from /sys/class/net if unpopulated
  ansible.builtin.shell: |
    for iface in /sys/class/net/*; do
      [ -e "$iface/address" ] || continue
      b="$(basename "$iface")"
      [ "$b" = "lo" ] && continue
      addr="$(cat "$iface/address" 2>/dev/null | tr -d ' \r\n')"
      if [ -n "$addr" ] && [ "$addr" != "00:00:00:00:00:00" ]; then
        echo "$addr"
        exit 0
      fi
    done
    exit 0
  register: probed_mac_result
  changed_when: false
  failed_when: false
  when: (device_mac | default('') | trim | length == 0) or (device_mac | lower == 'none')

- name: Update device_mac if probed from /sys/class/net
  ansible.builtin.set_fact:
    device_mac: "{{ probed_mac_result.stdout.strip() }}"
  when:
    - (device_mac | default('') | trim | length == 0) or (device_mac | lower == 'none')
    - probed_mac_result is defined
    - probed_mac_result.stdout is defined
    - probed_mac_result.stdout.strip() | length > 0

- name: Report missing MAC address
  ansible.builtin.debug:
    msg: "Warning: Unable to determine MAC address for host '{{ inventory_hostname }}'. Skipping LAN-Orangutan sync for this host."
  when: (device_mac | default('') | trim | length == 0) or (device_mac | lower == 'none')

- name: Post OS facts to LAN-Orangutan
  ansible.builtin.uri:
    url: "{{ orangutan_facts_url.rstrip('/') }}/api/devices/{{ device_mac }}/facts"
    method: POST
    headers:
      Authorization: "Bearer {{ orangutan_facts_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      os: "{{ ansible_distribution | default(ansible_os_family) }}"
      os_version: "{{ ansible_distribution_version | default('') }}"
      os_family: "{{ ansible_os_family | default('Linux') }}"
    status_code:
      - 200
      - 404
  register: orangutan_fact_sync_result
  delegate_to: localhost
  when: (device_mac | default('') | trim | length > 0) and (device_mac | lower != 'none')
  failed_when:
    - orangutan_fact_sync_result.status not in [200, 404]

- name: Report MAC not found in LAN-Orangutan (404)
  ansible.builtin.debug:
    msg:
      - "Notice: Host '{{ inventory_hostname }}' (MAC: {{ device_mac }}) was not found in LAN-Orangutan (404)."
      - "Action: Run a network scan in LAN-Orangutan so MAC {{ device_mac }} is discovered."
  when:
    - (device_mac | default('') | trim | length > 0) and (device_mac | lower != 'none')
    - orangutan_fact_sync_result is defined
    - orangutan_fact_sync_result.status | default(0) == 404

- name: Confirm OS facts updated in LAN-Orangutan
  ansible.builtin.debug:
    msg: "Updated LAN-Orangutan: {{ inventory_hostname }} -> {{ ansible_distribution | default(ansible_os_family) }} {{ ansible_distribution_version | default('') }} (MAC: {{ device_mac }})"
  when:
    - (device_mac | default('') | trim | length > 0) and (device_mac | lower != 'none')
    - orangutan_fact_sync_result is defined
    - orangutan_fact_sync_result.status | default(0) == 200
