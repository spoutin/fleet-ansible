---
- name: Verify LAN-Orangutan API token is present
  ansible.builtin.fail:
    msg: >-
      Cannot sync OS facts: LAN-Orangutan API token is missing or empty.
      Ensure ORANGUTAN_API_TOKEN or ORANGUTAN_PASSWORD is set in /etc/fleet/openbao.env,
      exported as an environment variable, or stored in OpenBao KV secrets at v1/fleet/data/credentials.
  when: (orangutan_facts_token | default(orangutan_api_token | default(''))) | length == 0
  run_once: true

- name: Determine target device MAC address from facts and inventory
  ansible.builtin.set_fact:
    discovered_mac: >-
      {{
        (resolved_mac | lower)
        if (resolved_mac is defined and resolved_mac and resolved_mac != '' and resolved_mac | lower != 'none')
        else (
          (ansible_default_ipv4.macaddress | lower)
          if (ansible_default_ipv4 is defined and ansible_default_ipv4.macaddress is defined and ansible_default_ipv4.macaddress and ansible_default_ipv4.macaddress != '' and ansible_default_ipv4.macaddress | lower != 'none')
          else (
            (orangutan_mac | lower)
            if (orangutan_mac is defined and orangutan_mac and orangutan_mac != '' and orangutan_mac | lower != 'none')
            else (
              (hostvars[inventory_hostname]['ansible_' + (ansible_default_ipv4.interface | default(''))]['macaddress'] | lower)
              if (ansible_default_ipv4 is defined and ansible_default_ipv4.interface is defined and hostvars[inventory_hostname]['ansible_' + ansible_default_ipv4.interface] is defined and hostvars[inventory_hostname]['ansible_' + ansible_default_ipv4.interface]['macaddress'] is defined and hostvars[inventory_hostname]['ansible_' + ansible_default_ipv4.interface]['macaddress'] != '' and hostvars[inventory_hostname]['ansible_' + ansible_default_ipv4.interface]['macaddress'] | lower != 'none')
              else ''
            )
          )
        )
      }}

- name: Probe interface MAC from /sys/class/net if unpopulated
  ansible.builtin.shell: |
    for iface in /sys/class/net/*; do
      [ -e "$iface/address" ] || continue
      b="$(basename "$iface")"
      [ "$b" = "lo" ] && continue
      addr="$(cat "$iface/address" 2>/dev/null | tr -d ' \r\n')"
      if [ -n "$addr" ] && [ "$addr" != "00:00:00:00:00:00" ]; then
        echo "$addr"
        exit 0
      fi
    done
    exit 0
  register: probed_mac_result
  changed_when: false
  failed_when: false
  when: (discovered_mac | default('') | trim | length == 0) or (discovered_mac | lower == 'none')

- name: Update discovered_mac if probed from /sys/class/net
  ansible.builtin.set_fact:
    discovered_mac: "{{ probed_mac_result.stdout.strip() | lower }}"
  when:
    - (discovered_mac | default('') | trim | length == 0) or (discovered_mac | lower == 'none')
    - probed_mac_result is defined
    - probed_mac_result.stdout is defined
    - probed_mac_result.stdout.strip() | length > 0

- name: Set resolved_mac if valid MAC address found
  ansible.builtin.set_fact:
    resolved_mac: "{{ discovered_mac | trim | lower }}"
  when:
    - discovered_mac is defined
    - discovered_mac | trim | length > 0
    - discovered_mac | lower != 'none'

- name: Determine target device IP address
  ansible.builtin.set_fact:
    host_ip: "{{ ansible_host | default((ansible_default_ipv4 | default({})).address | default(inventory_hostname)) }}"

- name: Determine LAN-Orangutan base URL
  ansible.builtin.set_fact:
    orangutan_base_url: "{{ ((orangutan_facts_url | default(orangutan_url | default('http://10.0.0.1:291'))).rstrip('/') | regex_replace('/api$', '')) }}"

- name: Construct facts payload
  ansible.builtin.set_fact:
    facts_payload:
      os: "{{ ansible_distribution | default(ansible_os_family) }}"
      os_version: "{{ ansible_distribution_version | default('') }}"
      os_family: "{{ ansible_os_family }}"
      mac: "{{ resolved_mac | default(omit) }}"

- name: Post OS facts to LAN-Orangutan by MAC address
  ansible.builtin.uri:
    url: "{{ orangutan_base_url }}/api/devices/{{ resolved_mac }}/facts"
    method: POST
    headers:
      Authorization: "Bearer {{ orangutan_facts_token | default(orangutan_api_token | default('')) }}"
      Content-Type: "application/json"
    body_format: json
    body: "{{ facts_payload | to_json }}"
    status_code:
      - 200
      - 404
  register: mac_facts_result
  delegate_to: localhost
  when: resolved_mac is defined and resolved_mac != ''

- name: Post OS facts to LAN-Orangutan by IP address fallback
  ansible.builtin.uri:
    url: "{{ orangutan_base_url }}/api/devices/{{ host_ip }}/facts"
    method: POST
    headers:
      Authorization: "Bearer {{ orangutan_facts_token | default(orangutan_api_token | default('')) }}"
      Content-Type: "application/json"
    body_format: json
    body: "{{ facts_payload | to_json }}"
    status_code:
      - 200
      - 404
  register: ip_facts_result
  delegate_to: localhost
  when: resolved_mac is not defined or resolved_mac == '' or (mac_facts_result is defined and mac_facts_result.status == 404)

- name: Confirm OS facts updated in LAN-Orangutan by MAC
  ansible.builtin.debug:
    msg: "Updated LAN-Orangutan: {{ inventory_hostname }} -> {{ ansible_distribution | default(ansible_os_family) }} {{ ansible_distribution_version | default('') }} (MAC: {{ resolved_mac }})"
  when:
    - mac_facts_result is defined
    - mac_facts_result.status | default(0) == 200

- name: Confirm OS facts updated in LAN-Orangutan by IP fallback
  ansible.builtin.debug:
    msg: "Updated LAN-Orangutan (IP fallback): {{ inventory_hostname }} -> {{ ansible_distribution | default(ansible_os_family) }} {{ ansible_distribution_version | default('') }} (IP: {{ host_ip }}{{ ', MAC: ' + resolved_mac if (resolved_mac is defined and resolved_mac != '') else '' }})"
  when:
    - ip_facts_result is defined
    - ip_facts_result.status | default(0) == 200

- name: Fail when host not found in LAN-Orangutan by MAC or IP
  ansible.builtin.fail:
    msg: "Host '{{ inventory_hostname }}' was not found in LAN-Orangutan by MAC ('{{ resolved_mac | default('N/A') }}') or by IP ('{{ host_ip }}'). Ensure the device is discovered in LAN-Orangutan before syncing facts."
  when:
    - (mac_facts_result is not defined or mac_facts_result.status | default(0) != 200)
    - (ip_facts_result is not defined or ip_facts_result.status | default(0) != 200)
