---
- name: Refresh apt repository cache
  ansible.builtin.command: apt-get update
  register: apt_cache_update
  changed_when: false
  failed_when: false

- name: Fail if apt repository cache refresh failed
  ansible.builtin.fail:
    msg:
      - "Apt repository refresh failed on host '{{ inventory_hostname }}' (IP: {{ ansible_host | default(ansible_default_ipv4.address | default('N/A')) }})."
      - "Repository errors:"
      - "{{ (apt_cache_update.stderr_lines | default([])) | select('match', '^(E:|W:)') | list | default(apt_cache_update.stderr_lines | default(apt_cache_update.stdout_lines | default(['Unknown apt error']))) }}"
  when:
    - apt_cache_update.rc != 0

- name: Upgrade installed Debian / Ubuntu packages
  ansible.builtin.apt:
    update_cache: false
    upgrade: "dist"
    dpkg_options: "force-confdef,force-confold"

- name: Autoremove unused packages and clean apt cache
  ansible.builtin.apt:
    autoremove: true
    autoclean: true

- name: Check if Debian / Ubuntu requires reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: debian_reboot_file

- name: Set system_reboot_required fact for Debian / Ubuntu
  ansible.builtin.set_fact:
    system_reboot_required: "{{ debian_reboot_file.stat.exists }}"
