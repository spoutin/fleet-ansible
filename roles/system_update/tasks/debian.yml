---
- name: Update apt package cache and upgrade all packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0
    upgrade: "dist"
    dpkg_options: "force-confdef,force-confold"

- name: Autoremove unused packages and clean apt cache
  ansible.builtin.apt:
    autoremove: true
    autoclean: true

- name: Check if Debian/Ubuntu requires reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: debian_reboot_file

- name: Set system_reboot_required fact for Debian/Ubuntu
  ansible.builtin.set_fact:
    system_reboot_required: "{{ debian_reboot_file.stat.exists }}"
