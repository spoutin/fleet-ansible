---
- name: Apply Debian / Ubuntu updates
  ansible.builtin.include_tasks: debian.yml
  when: ansible_os_family == 'Debian'

- name: Apply Alpine Linux updates
  ansible.builtin.include_tasks: alpine.yml
  when: ansible_os_family == 'Alpine'

- name: Apply RedHat / CentOS / Rocky / Fedora updates
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_os_family == 'RedHat'

- name: Handle reboot workflow
  ansible.builtin.include_tasks: reboot.yml
