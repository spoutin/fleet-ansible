---
- name: Ensure ansible service user exists
  ansible.builtin.user:
    name: ansible
    shell: /bin/bash
    create_home: true
    state: present
  ignore_errors: true

- name: Configure passwordless sudo for ansible user
  ansible.builtin.copy:
    content: "ansible ALL=(ALL) NOPASSWD:ALL\n"
    dest: /etc/sudoers.d/ansible
    owner: root
    group: root
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'
  ignore_errors: true

- name: Ensure ~/.ssh directory exists for ansible user
  ansible.builtin.file:
    path: /home/ansible/.ssh
    state: directory
    owner: ansible
    group: ansible
    mode: '0700'
  ignore_errors: true

- name: Authorize controller public key for ansible user
  ansible.builtin.lineinfile:
    path: /home/ansible/.ssh/authorized_keys
    create: true
    owner: ansible
    group: ansible
    mode: '0600'
    line: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/ansible_controller.pub', errors='ignore') }}"
    state: present
  when: lookup('file', lookup('env', 'HOME') + '/.ssh/ansible_controller.pub', errors='ignore') != ''
  ignore_errors: true

- name: Ensure /etc/ssh directory exists
  ansible.builtin.file:
    path: "{{ ssh_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download SSH CA public key
  ansible.builtin.get_url:
    url: "{{ ssh_ca_public_key_url }}"
    dest: "{{ ssh_ca_keys_path }}"
    owner: root
    group: root
    mode: '0644'
    validate_certs: false
  register: download_ca_key
  ignore_errors: true

- name: Fallback download of SSH CA public key from OpenBao directly
  ansible.builtin.get_url:
    url: "{{ ssh_ca_fallback_url }}"
    dest: "{{ ssh_ca_keys_path }}"
    owner: root
    group: root
    mode: '0644'
    validate_certs: false
  when: download_ca_key is failed

- name: Download OpenSSH Key Revocation List (KRL)
  ansible.builtin.get_url:
    url: "{{ ssh_krl_url }}"
    dest: "{{ ssh_krl_path }}"
    owner: root
    group: root
    mode: '0644'
    validate_certs: false
  register: download_krl
  ignore_errors: true

- name: Fallback download of OpenSSH KRL
  ansible.builtin.get_url:
    url: "{{ ssh_krl_fallback_url }}"
    dest: "{{ ssh_krl_path }}"
    owner: root
    group: root
    mode: '0644'
    validate_certs: false
  when: download_krl is failed
  register: download_krl_fallback
  ignore_errors: true

- name: Check if KRL exists on host
  ansible.builtin.stat:
    path: "{{ ssh_krl_path }}"
  register: krl_stat

- name: Initialize safe empty KRL if absent
  ansible.builtin.copy:
    content: "{{ 'U1NIS1JMCgAAAAABAAAAAAAAAAAAAAAAasjsugAAAAAAAAAAAAAAAAAAAAA=' | b64decode }}"
    dest: "{{ ssh_krl_path }}"
    owner: root
    group: root
    mode: '0644'
  when: not krl_stat.stat.exists

- name: Check if /etc/ssh/sshd_config.d is supported
  ansible.builtin.stat:
    path: "{{ sshd_config_dropin_dir }}"
  register: dropin_dir_stat

- name: Set dropin support fact
  ansible.builtin.set_fact:
    use_dropin: "{{ dropin_dir_stat.stat.exists or supports_sshd_config_d | default(true) }}"

- name: Deploy SSH CA drop-in configuration
  when: use_dropin | bool
  block:
    - name: Ensure /etc/ssh/sshd_config.d exists
      ansible.builtin.file:
        path: "{{ sshd_config_dropin_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Ensure Include /etc/ssh/sshd_config.d/*.conf exists in sshd_config
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        line: "Include /etc/ssh/sshd_config.d/*.conf"
        insertbefore: BOF
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      notify: reload sshd

    - name: Deploy 60-pki-ssh-ca.conf drop-in
      ansible.builtin.template:
        src: 60-pki-ssh-ca.conf.j2
        dest: "{{ sshd_config_dropin_path }}"
        owner: root
        group: root
        mode: '0644'
      notify: reload sshd

- name: Configure sshd_config directly (for systems without drop-in directory)
  when: not (use_dropin | bool)
  block:
    - name: Configure TrustedUserCAKeys in sshd_config
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?TrustedUserCAKeys'
        line: "TrustedUserCAKeys {{ ssh_ca_keys_path }}"
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      notify: reload sshd

    - name: Configure RevokedKeys in sshd_config
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?RevokedKeys'
        line: "RevokedKeys {{ ssh_krl_path }}"
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      notify: reload sshd

- name: Deploy fleet-ssh-krl-sync.service unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/fleet-ssh-krl-sync.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Sync Spoutin OpenSSH Key Revocation List (KRL)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c 'curl -s -f --etag-compare /tmp/krl.etag --etag-save /tmp/krl.etag {{ ssh_krl_url }} -o {{ ssh_krl_path }}.incoming && mv -f {{ ssh_krl_path }}.incoming {{ ssh_krl_path }} && chmod 644 {{ ssh_krl_path }} || true'
  ignore_errors: true

- name: Deploy fleet-ssh-krl-sync.timer unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/fleet-ssh-krl-sync.timer
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Fast 15-Minute OpenSSH KRL Sync Timer

      [Timer]
      OnCalendar=*:0/15
      RandomizedDelaySec=60
      Persistent=true

      [Install]
      WantedBy=timers.target
  ignore_errors: true

- name: Enable and start fleet-ssh-krl-sync.timer
  ansible.builtin.systemd:
    name: fleet-ssh-krl-sync.timer
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: true
