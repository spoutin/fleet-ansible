---
- name: Ensure ansible service user exists
  ansible.builtin.user:
    name: ansible
    shell: /bin/bash
    create_home: true
    state: present
  ignore_errors: true

- name: Configure passwordless sudo for ansible user
  ansible.builtin.copy:
    content: "ansible ALL=(ALL) NOPASSWD:ALL\n"
    dest: /etc/sudoers.d/ansible
    owner: root
    group: root
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'
  ignore_errors: true

- name: Ensure ~/.ssh directory exists for ansible user
  ansible.builtin.file:
    path: /home/ansible/.ssh
    state: directory
    owner: ansible
    group: ansible
    mode: '0700'
  ignore_errors: true

- name: Authorize controller public key for ansible user
  ansible.builtin.lineinfile:
    path: /home/ansible/.ssh/authorized_keys
    create: true
    owner: ansible
    group: ansible
    mode: '0600'
    line: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/ansible_controller.pub', errors='ignore') }}"
    state: present
  when: lookup('file', lookup('env', 'HOME') + '/.ssh/ansible_controller.pub', errors='ignore') != ''
  ignore_errors: true

- name: Ensure /etc/ssh directory exists
  ansible.builtin.file:
    path: "{{ ssh_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Stage SSH CA credentials and KRL on Ansible controller
  delegate_to: localhost
  run_once: true
  become: false
  block:
    - name: Fetch SSH CA public key from PKI or OpenBao to controller
      ansible.builtin.get_url:
        url: "{{ ssh_ca_public_key_url }}"
        dest: /tmp/fleet_ca_public_key.pub
        mode: '0644'
        validate_certs: false
      register: controller_dl_ca
      ignore_errors: true

    - name: Fallback fetch SSH CA public key from OpenBao directly to controller
      ansible.builtin.get_url:
        url: "{{ ssh_ca_fallback_url }}"
        dest: /tmp/fleet_ca_public_key.pub
        mode: '0644'
        validate_certs: false
      when: controller_dl_ca is failed
      ignore_errors: true

    - name: Fetch OpenSSH Key Revocation List (KRL) to controller
      ansible.builtin.get_url:
        url: "{{ ssh_krl_url }}"
        dest: /tmp/fleet_revoked_keys.krl
        mode: '0644'
        validate_certs: false
      register: controller_dl_krl
      ignore_errors: true

    - name: Fallback fetch OpenSSH KRL to controller
      ansible.builtin.get_url:
        url: "{{ ssh_krl_fallback_url }}"
        dest: /tmp/fleet_revoked_keys.krl
        mode: '0644'
        validate_certs: false
      when: controller_dl_krl is failed
      register: controller_dl_krl_fallback
      ignore_errors: true

    - name: Check if KRL was staged on controller
      ansible.builtin.stat:
        path: /tmp/fleet_revoked_keys.krl
      register: controller_krl_stat

    - name: Initialize safe empty KRL on controller if absent
      ansible.builtin.copy:
        content: "{{ 'U1NIS1JMCgAAAAABAAAAAAAAAAAAAAAAasjsugAAAAAAAAAAAAAAAAAAAAA=' | b64decode }}"
        dest: /tmp/fleet_revoked_keys.krl
        mode: '0644'
      when: not controller_krl_stat.stat.exists or controller_krl_stat.stat.size == 0

- name: Push SSH CA public key to host over SSH connection
  ansible.builtin.copy:
    src: /tmp/fleet_ca_public_key.pub
    dest: "{{ ssh_ca_keys_path }}"
    owner: root
    group: root
    mode: '0644'

- name: Push OpenSSH KRL to host over SSH connection
  ansible.builtin.copy:
    src: /tmp/fleet_revoked_keys.krl
    dest: "{{ ssh_krl_path }}"
    owner: root
    group: root
    mode: '0644'

- name: Check if /etc/ssh/sshd_config.d is supported
  ansible.builtin.stat:
    path: "{{ sshd_config_dropin_dir }}"
  register: dropin_dir_stat

- name: Set dropin support fact
  ansible.builtin.set_fact:
    use_dropin: "{{ dropin_dir_stat.stat.exists or supports_sshd_config_d | default(true) }}"

- name: Deploy SSH CA drop-in configuration
  when: use_dropin | bool
  block:
    - name: Ensure /etc/ssh/sshd_config.d exists
      ansible.builtin.file:
        path: "{{ sshd_config_dropin_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Ensure Include /etc/ssh/sshd_config.d/*.conf exists in sshd_config
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        line: "Include /etc/ssh/sshd_config.d/*.conf"
        insertbefore: BOF
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      notify: reload sshd

    - name: Deploy 60-pki-ssh-ca.conf drop-in
      ansible.builtin.template:
        src: 60-pki-ssh-ca.conf.j2
        dest: "{{ sshd_config_dropin_path }}"
        owner: root
        group: root
        mode: '0644'
      notify: reload sshd

- name: Configure sshd_config directly (for systems without drop-in directory)
  when: not (use_dropin | bool)
  block:
    - name: Configure TrustedUserCAKeys in sshd_config
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?TrustedUserCAKeys'
        line: "TrustedUserCAKeys {{ ssh_ca_keys_path }}"
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      notify: reload sshd

    - name: Configure RevokedKeys in sshd_config
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?RevokedKeys'
        line: "RevokedKeys {{ ssh_krl_path }}"
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      notify: reload sshd

- name: Remove legacy client-side KRL sync timer if present
  ansible.builtin.systemd:
    name: fleet-ssh-krl-sync.timer
    enabled: false
    state: stopped
  ignore_errors: true

- name: Remove legacy client-side KRL sync unit files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/fleet-ssh-krl-sync.timer
    - /etc/systemd/system/fleet-ssh-krl-sync.service
    - /tmp/krl.etag
    - /etc/ssh/revoked-keys.krl.incoming
  ignore_errors: true
