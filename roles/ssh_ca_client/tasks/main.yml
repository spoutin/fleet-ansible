---
- name: Ensure #includedir /etc/sudoers.d exists in /etc/sudoers
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    line: "#includedir /etc/sudoers.d"
    state: present
    validate: '/usr/sbin/visudo -cf %s'
  ignore_errors: true

- name: Ensure ansible service user exists
  ansible.builtin.user:
    name: ansible
    shell: /bin/bash
    create_home: true
    state: present
  ignore_errors: true

- name: Configure passwordless sudo for ansible user
  ansible.builtin.shell: |
    mkdir -p /etc/sudoers.d && \
    echo "ansible ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/ansible && \
    chmod 0440 /etc/sudoers.d/ansible && \
    /usr/sbin/visudo -cf /etc/sudoers.d/ansible 2>/dev/null || true
    if [ -x /usr/bin/midclt ]; then
      python3 -c "
      import subprocess, json
      res = subprocess.run(['/usr/bin/midclt', 'call', 'user.query', '[[\"username\", \"=\", \"ansible\"]]'], capture_output=True, text=True)
      if res.returncode == 0:
          users = json.loads(res.stdout) if res.stdout.strip() else []
          if users:
              u = users[0]
              if 'ALL' not in u.get('sudo_commands_nopasswd', []):
                  payload = json.dumps({'sudo_commands': ['ALL'], 'sudo_commands_nopasswd': ['ALL']})
                  subprocess.run(['/usr/bin/midclt', 'call', 'user.update', str(u['id']), payload])
      " 2>/dev/null || true
    fi
  ignore_errors: true

- name: Ensure operator user exists
  ansible.builtin.shell: |
    id -u "{{ operator_user }}" >/dev/null 2>&1 || (useradd -m -s /bin/bash "{{ operator_user }}" 2>/dev/null || adduser -D -s /bin/sh "{{ operator_user }}" 2>/dev/null || true)
    if [ -x /usr/bin/midclt ]; then
      python3 -c "
      import subprocess, json
      res = subprocess.run(['/usr/bin/midclt', 'call', 'user.query', '[[\"username\", \"=\", \"{{ operator_user }}\"]]'], capture_output=True, text=True)
      if res.returncode == 0:
          users = json.loads(res.stdout) if res.stdout.strip() else []
          if users:
              u = users[0]
              if 'ALL' not in u.get('sudo_commands_nopasswd', []):
                  payload = json.dumps({'sudo_commands': ['ALL'], 'sudo_commands_nopasswd': ['ALL']})
                  subprocess.run(['/usr/bin/midclt', 'call', 'user.update', str(u['id']), payload])
          else:
              payload = json.dumps({
                  'username': '{{ operator_user }}',
                  'full_name': '{{ operator_user }}',
                  'shell': '/bin/bash',
                  'sudo_commands': ['ALL'],
                  'sudo_commands_nopasswd': ['ALL'],
                  'group_create': True,
                  'password_disabled': True
              })
              subprocess.run(['/usr/bin/midclt', 'call', 'user.create', payload])
      " 2>/dev/null || true
    fi
  when: operator_user is defined and operator_user != ""
  ignore_errors: true

- name: Configure passwordless sudo for operator user
  ansible.builtin.copy:
    content: "{{ operator_user }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/{{ operator_user }}"
    owner: root
    group: root
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'
  when: operator_user is defined and operator_user != ""
  ignore_errors: true

- name: Ensure ~/.ssh directory exists for ansible user
  ansible.builtin.file:
    path: /home/ansible/.ssh
    state: directory
    owner: ansible
    group: ansible
    mode: '0700'
  ignore_errors: true

- name: Authorize controller public key for ansible user
  ansible.builtin.lineinfile:
    path: /home/ansible/.ssh/authorized_keys
    create: true
    owner: ansible
    group: ansible
    mode: '0600'
    line: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/ansible_controller.pub', errors='ignore') }}"
    state: present
  when: lookup('file', lookup('env', 'HOME') + '/.ssh/ansible_controller.pub', errors='ignore') != ''
  ignore_errors: true

- name: Ensure /etc/ssh directory exists
  ansible.builtin.file:
    path: "{{ ssh_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Stage SSH CA credentials and KRL on Ansible controller
  delegate_to: localhost
  run_once: true
  become: false
  block:
    - name: Fetch SSH CA public key from PKI or OpenBao to controller
      ansible.builtin.get_url:
        url: "{{ ssh_ca_public_key_url }}"
        dest: /tmp/fleet_ca_public_key.pub
        mode: '0644'
        validate_certs: false
      register: controller_dl_ca
      ignore_errors: true

    - name: Fallback fetch SSH CA public key from OpenBao directly to controller
      ansible.builtin.get_url:
        url: "{{ ssh_ca_fallback_url }}"
        dest: /tmp/fleet_ca_public_key.pub
        mode: '0644'
        validate_certs: false
      when: controller_dl_ca is failed
      ignore_errors: true

    - name: Fetch OpenSSH Key Revocation List (KRL) to controller
      ansible.builtin.get_url:
        url: "{{ ssh_krl_url }}"
        dest: /tmp/fleet_revoked_keys.krl
        mode: '0644'
        validate_certs: false
      register: controller_dl_krl
      ignore_errors: true

    - name: Fallback fetch OpenSSH KRL to controller
      ansible.builtin.get_url:
        url: "{{ ssh_krl_fallback_url }}"
        dest: /tmp/fleet_revoked_keys.krl
        mode: '0644'
        validate_certs: false
      when: controller_dl_krl is failed
      register: controller_dl_krl_fallback
      ignore_errors: true

    - name: Check if KRL was staged on controller
      ansible.builtin.stat:
        path: /tmp/fleet_revoked_keys.krl
      register: controller_krl_stat

    - name: Initialize safe empty KRL on controller if absent
      ansible.builtin.copy:
        content: "{{ 'U1NIS1JMCgAAAAABAAAAAAAAAAAAAAAAasjsugAAAAAAAAAAAAAAAAAAAAA=' | b64decode }}"
        dest: /tmp/fleet_revoked_keys.krl
        mode: '0644'
      when: not controller_krl_stat.stat.exists or controller_krl_stat.stat.size == 0

- name: Push SSH CA public key to host over SSH connection
  ansible.builtin.copy:
    src: /tmp/fleet_ca_public_key.pub
    dest: "{{ ssh_ca_keys_path }}"
    owner: root
    group: root
    mode: '0644'
  notify: restart sshd

- name: Push OpenSSH KRL to host over SSH connection
  ansible.builtin.copy:
    src: /tmp/fleet_revoked_keys.krl
    dest: "{{ ssh_krl_path }}"
    owner: root
    group: root
    mode: '0644'
  notify: restart sshd

- name: Configure sshd for SSH CA trust and revocation list
  ansible.builtin.shell: |
    CHANGED=0
    CA_CONF="{{ sshd_config_dropin_path }}"
    CA_DIR="{{ sshd_config_dropin_dir }}"
    CA_KEY="{{ ssh_ca_keys_path }}"
    KRL_PATH="{{ ssh_krl_path }}"

    if [ -d "$CA_DIR" ] || [ -d "/etc/ssh" ]; then
      mkdir -p "$CA_DIR" 2>/dev/null || true
      if [ -d "$CA_DIR" ]; then
        grep -q "Include /etc/ssh/sshd_config.d/\*\.conf" /etc/ssh/sshd_config 2>/dev/null || {
          sed -i '1s|^|Include /etc/ssh/sshd_config.d/*.conf\n|' /etc/ssh/sshd_config 2>/dev/null || true
          CHANGED=1
        }
        NEW_CONF=$(printf "# Managed by fleet-ansible\nTrustedUserCAKeys %s\nRevokedKeys %s\n" "$CA_KEY" "$KRL_PATH")
        OLD_CONF=$(cat "$CA_CONF" 2>/dev/null || true)
        if [ "$NEW_CONF" != "$OLD_CONF" ]; then
          printf "%s\n" "$NEW_CONF" > "$CA_CONF" 2>/dev/null || true
          chmod 644 "$CA_CONF" 2>/dev/null || true
          CHANGED=1
        fi
      else
        grep -q "^TrustedUserCAKeys $CA_KEY" /etc/ssh/sshd_config 2>/dev/null || {
          echo "TrustedUserCAKeys $CA_KEY" >> /etc/ssh/sshd_config
          CHANGED=1
        }
        grep -q "^RevokedKeys $KRL_PATH" /etc/ssh/sshd_config 2>/dev/null || {
          echo "RevokedKeys $KRL_PATH" >> /etc/ssh/sshd_config
          CHANGED=1
        }
      fi
    fi

    if [ -x /usr/bin/midclt ]; then
      python3 -c "
      import subprocess, json
      res = subprocess.run(['/usr/bin/midclt', 'call', 'ssh.config'], capture_output=True, text=True)
      if res.returncode == 0:
          cfg = json.loads(res.stdout) if res.stdout.strip() else {}
          current = cfg.get('auxiliary_parameters', '') or ''
          ca_line = 'TrustedUserCAKeys $CA_KEY'
          krl_line = 'RevokedKeys $KRL_PATH'
          lines = [l.strip() for l in current.splitlines() if l.strip()]
          if not any('TrustedUserCAKeys' in l for l in lines):
              lines.append(ca_line)
          if not any('RevokedKeys' in l for l in lines):
              lines.append(krl_line)
          new_aux = '\n'.join(lines)
          if new_aux != current.strip():
              subprocess.run(['/usr/bin/midclt', 'call', 'ssh.update', json.dumps({'auxiliary_parameters': new_aux})])
              print('CHANGED')
      " 2>/dev/null | grep -q "CHANGED" && CHANGED=1 || true
    fi

    /usr/sbin/sshd -t 2>/dev/null || sshd -t 2>/dev/null || true

    if [ "$CHANGED" -eq 1 ]; then
      echo "CHANGED"
    fi
  register: sshd_ca_config_result
  changed_when: "'CHANGED' in sshd_ca_config_result.stdout"
  notify: restart sshd

- name: Force restart sshd if requested
  ansible.builtin.shell: |
    (/usr/sbin/sshd -t 2>/dev/null || sshd -t 2>/dev/null) && \
    (systemctl restart ssh 2>/dev/null || \
     systemctl restart sshd 2>/dev/null || \
     rc-service sshd restart 2>/dev/null || \
     service ssh restart 2>/dev/null || \
     service sshd restart 2>/dev/null || \
     (which midclt >/dev/null 2>&1 && midclt call service.restart 'ssh') || true)
  when: restart_sshd | default(false) | bool
